<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de Fuerza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16181a;
    --bg-elevated: #1f2224;
    --ink: #eee9df;
    --ink-dim: #9a9d97;
    --line: #33373a;
    --accent: #e2a13a;
    --accent-ink: #16181a;
    --accent-dim: #4a3d24;
    --done: #6fae7c;
    --danger: #d16b5c;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1ec;
      --bg-elevated: #ffffff;
      --ink: #1c1d1a;
      --ink-dim: #6b6d66;
      --line: #ddd8cd;
      --accent: #c9791e;
      --accent-ink: #ffffff;
      --accent-dim: #f0dcbb;
      --done: #4c8a5a;
      --danger: #b8493a;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181a;
    --bg-elevated: #1f2224;
    --ink: #eee9df;
    --ink-dim: #9a9d97;
    --line: #33373a;
    --accent: #e2a13a;
    --accent-ink: #16181a;
    --accent-dim: #4a3d24;
    --done: #6fae7c;
    --danger: #d16b5c;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
    transition: background 0.25s ease;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 8px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Bebas Neue', 'IBM Plex Sans', sans-serif;
    font-size: 34px;
    letter-spacing: 0.5px;
    margin: 0;
    line-height: 1;
  }
  h1 span { color: var(--accent); }
  .streak {
    font-size: 13px;
    color: var(--ink-dim);
    text-align: right;
    line-height: 1.3;
  }
  .streak b { color: var(--accent); font-size: 16px; display:block; font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px;}

  .view-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
  }
  .view-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-dim);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .view-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-elevated);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .tab .dot {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--done); margin-right: 6px; vertical-align:middle;
    opacity: 0;
  }
  .tab .dot.on { opacity: 1; }

  .day-header {
    margin-bottom: 10px;
  }
  .day-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.3px;
    margin: 0 0 8px;
    font-weight: 400;
  }
  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  .video-link {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-dim);
    color: var(--accent);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 14px;
    margin-bottom: 14px;
  }

  section.block {
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 14px 6px;
    margin-bottom: 14px;
  }
  section.block h3 {
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0.2px;
    color: var(--ink-dim);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .item {
    display: flex;
    flex-direction: column;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .item:first-of-type { border-top: none; }
  .item-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .check {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--line);
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
  }
  .check.checked {
    background: var(--done);
    border-color: var(--done);
  }
  .check.checked::after {
    content: "";
    width: 6px;
    height: 10px;
    border: solid var(--bg-elevated);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .item-body { flex: 1; cursor: pointer; }
  .item-name {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.3;
  }
  .item.done .item-name { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--line); }
  .item-meta {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 1px;
  }
  .item-cue {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 3px;
    line-height: 1.4;
  }
  .timer-btn {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-dim);
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    align-self: center;
  }
  .timer-btn.running { color: var(--danger); }

  .howto-btn {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: var(--accent-dim);
    color: var(--accent);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    align-self: center;
    text-decoration: none;
  }

  .item-visual {
    margin: 8px 0 0 32px;
    width: 84px;
    height: 84px;
    background: radial-gradient(circle at 32% 28%, var(--accent-dim) 0%, var(--bg) 72%);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex: 0 0 auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), var(--shadow);
  }
  .item-visual svg {
    width: 62px;
    height: 62px;
    display: block;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .note {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.5;
    padding: 4px 2px 14px;
  }
  .note strong { color: var(--ink); }

  .round-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent-dim);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .round-box.complete { background: color-mix(in srgb, var(--done) 25%, var(--accent-dim)); }
  .round-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .round-label b {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--accent);
    margin-right: 4px;
    letter-spacing: 0.3px;
  }
  .round-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .round-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: var(--bg-elevated);
    color: var(--ink);
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .round-btn:active { transform: scale(0.94); }

  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
  }

  .finish-btn {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .finish-btn.done {
    background: var(--done);
    color: #fff;
  }

  .share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border-radius: 14px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 85vw;
    text-align: center;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .theme-toggle {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Plan de <span>Fuerza</span></h1>
    <div class="streak"><b id="streakNum">0/5</b>esta semana</div>
  </header>

  <div class="view-switch">
    <button class="view-btn active" id="viewWeekBtn">📅 Plan semanal</button>
    <button class="view-btn" id="viewStretchBtn">🧘 Estiramientos</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="day-header">
    <h2 id="dayTitle"></h2>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="sections"></div>

  <button class="finish-btn" id="finishBtn">✓ Día terminado</button>
  <button class="share-btn" id="shareBtn">📤 Compartir resumen del día</button>
  <button class="reset-btn" id="resetBtn">Reiniciar el día de hoy</button>
</div>

<div class="toast" id="toast"></div>

<button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌓</button>

function todayKey() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function isoWeekKey() {
  const d = new Date();
  const onejan = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  return d.getFullYear() + "-W" + week;
}
function loadProgress() {
  try {
    const raw = localStorage.getItem("workout-progress");
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem("workout-progress", JSON.stringify(p)); } catch(e) {}
}
function loadRounds() {
  try {
    const raw = localStorage.getItem("workout-rounds");
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveRounds(r) {
  try { localStorage.setItem("workout-rounds", JSON.stringify(r)); } catch(e) {}
}
function loadFinished() {
  try {
    const raw = localStorage.getItem("workout-finished");
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveFinished(f) {
  try { localStorage.setItem("workout-finished", JSON.stringify(f)); } catch(e) {}
}
function maxRoundsFromName(name) {
  const nums = (name.match(/\d+/g) || []).map(Number);
  if (!nums.length) return null;
  return Math.max(...nums);
}
function loadTheme() {
  try { return localStorage.getItem("workout-theme") || null; } catch(e) { return null; }
}
function saveTheme(v) {
  try { localStorage.setItem("workout-theme", v); } catch(e) {}
}

let progress = loadProgress();
let rounds = loadRounds();
let finished = loadFinished();
const STRETCH_IDX = DAYS.length - 1; // el día de estiramientos es siempre el último del arreglo
const WEEKDAY_COUNT = STRETCH_IDX; // 5 días de lunes a viernes
let currentView = "week"; // "week" | "stretch"
let lastWeekdayIdx = new Date().getDay() >= 1 && new Date().getDay() <= 5 ? new Date().getDay() - 1 : 0;
let activeDayIdx = lastWeekdayIdx;

function isDayComplete(idx) {
  const key = dateKeyForDay(idx);
  if (finished[key]) return true;
  const dp = progress[key] || {};
  const total = DAYS[idx].sections.reduce((a,s)=>a+s.items.length,0);
  const checked = Object.values(dp).filter(Boolean).length;
  return total > 0 && checked >= total;
}

const tabsEl = document.getElementById("tabs");
const sectionsEl = document.getElementById("sections");
const dayTitleEl = document.getElementById("dayTitle");
const progressFillEl = document.getElementById("progressFill");
const progressLabelEl = document.getElementById("progressLabel");
const streakNumEl = document.getElementById("streakNum");

function dateKeyForDay(dayIdx) {
  // progress is keyed by real calendar date so it resets naturally each day;
  // but we allow viewing any day's checklist using today's date + day key combined
  return todayKey() + "_" + DAYS[dayIdx].key;
}

function getDayProgress(dayIdx) {
  const key = dateKeyForDay(dayIdx);
  return progress[key] || {};
}

function setItemDone(dayIdx, itemId, val) {
  const key = dateKeyForDay(dayIdx);
  if (!progress[key]) progress[key] = {};
  progress[key][itemId] = val;
  saveProgress(progress);
}

function countWeekStreak() {
  let done = 0;
  const d = new Date();
  for (let i = 0; i < 5; i++) {
    const dt = new Date(d);
    dt.setDate(d.getDate() - d.getDay() + 1 + i); // Mon..Fri of this week
    const dk = dt.toISOString().slice(0,10);
    const dayKey = dk + "_" + DAYS[i].key;
    if (finished[dayKey]) { done++; continue; }
    const dp = progress[dayKey];
    if (!dp) continue;
    const total = DAYS[i].sections.reduce((a,s)=>a+s.items.length,0);
    const checked = Object.values(dp).filter(Boolean).length;
    if (total > 0 && checked >= total) done++;
  }
  return done;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  DAYS.slice(0, WEEKDAY_COUNT).forEach((d, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (idx === activeDayIdx ? " active" : "");
    const complete = isDayComplete(idx);
    btn.innerHTML = `<span class="dot ${complete ? "on":""}"></span>${d.label}`;
    btn.onclick = () => { activeDayIdx = idx; lastWeekdayIdx = idx; renderAll(); };
    tabsEl.appendChild(btn);
  });
}

function setView(view) {
  currentView = view;
  if (view === "week") {
    activeDayIdx = lastWeekdayIdx;
  } else {
    activeDayIdx = STRETCH_IDX;
  }
  document.getElementById("viewWeekBtn").classList.toggle("active", view === "week");
  document.getElementById("viewStretchBtn").classList.toggle("active", view === "stretch");
  tabsEl.style.display = view === "week" ? "flex" : "none";
  renderAll();
}
document.getElementById("viewWeekBtn").onclick = () => setView("week");
document.getElementById("viewStretchBtn").onclick = () => setView("stretch");

let timers = {};

let audioCtx = null;
function beep(freq, dur) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur + 0.02);
  } catch (e) {}
}

function renderDay() {
  const day = DAYS[activeDayIdx];
  dayTitleEl.textContent = day.title;
  sectionsEl.innerHTML = "";
  const dp = getDayProgress(activeDayIdx);

  if (day.videoUrl) {
    const vLink = document.createElement("a");
    vLink.className = "video-link";
    vLink.href = day.videoUrl;
    vLink.target = "_blank";
    vLink.rel = "noopener noreferrer";
    vLink.textContent = day.videoLabel || "▶ Ver video original";
    sectionsEl.appendChild(vLink);
  }

  let totalItems = 0, doneItems = 0;

  day.sections.forEach((sec, si) => {
    const block = document.createElement("section");
    block.className = "block";
    const h3 = document.createElement("h3");
    h3.textContent = sec.name;
    block.appendChild(h3);

    if (sec.note) {
      const noteEl = document.createElement("div");
      noteEl.className = "note";
      noteEl.textContent = sec.note;
      block.appendChild(noteEl);
    }

    const maxRounds = /ronda/i.test(sec.name) ? maxRoundsFromName(sec.name) : null;
    if (maxRounds) {
      const rKey = dateKeyForDay(activeDayIdx) + "_" + si;
      const current = rounds[rKey] || 0;

      const box = document.createElement("div");
      box.className = "round-box" + (current >= maxRounds ? " complete" : "");

      const label = document.createElement("div");
      label.className = "round-label";
      label.innerHTML = `<b>${current}</b> de ${maxRounds} rondas`;

      const controls = document.createElement("div");
      controls.className = "round-controls";

      const minusBtn = document.createElement("button");
      minusBtn.className = "round-btn";
      minusBtn.textContent = "–";
      minusBtn.onclick = () => {
        rounds[rKey] = Math.max(0, (rounds[rKey] || 0) - 1);
        saveRounds(rounds);
        renderDay();
      };

      const plusBtn = document.createElement("button");
      plusBtn.className = "round-btn";
      plusBtn.textContent = "+";
      plusBtn.onclick = () => {
        rounds[rKey] = Math.min(maxRounds, (rounds[rKey] || 0) + 1);
        saveRounds(rounds);
        // Al subir de ronda, desmarca los ejercicios de este circuito para repetirlos en la nueva ronda
        const pKey = dateKeyForDay(activeDayIdx);
        if (!progress[pKey]) progress[pKey] = {};
        sec.items.forEach((_, ii) => { progress[pKey][si + "-" + ii] = false; });
        saveProgress(progress);
        renderDay();
        if (navigator.vibrate) { try { navigator.vibrate(60); } catch(e){} }
      };

      controls.appendChild(minusBtn);
      controls.appendChild(plusBtn);
      box.appendChild(label);
      box.appendChild(controls);
      block.appendChild(box);
    }

    sec.items.forEach((it, ii) => {
      totalItems++;
      const itemId = si + "-" + ii;
      const done = !!dp[itemId];
      if (done) doneItems++;

      const row = document.createElement("div");
      row.className = "item" + (done ? " done" : "");

      const top = document.createElement("div");
      top.className = "item-top";

      const check = document.createElement("div");
      check.className = "check" + (done ? " checked" : "");
      check.onclick = () => {
        const newVal = !dp[itemId];
        setItemDone(activeDayIdx, itemId, newVal);
        renderAll();
      };

      const body = document.createElement("div");
      body.className = "item-body";
      body.onclick = check.onclick;
      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = it.t;
      body.appendChild(name);
      if (it.m) {
        const meta = document.createElement("div");
        meta.className = "item-meta";
        meta.textContent = it.m;
        body.appendChild(meta);
      }
      if (it.cue) {
        const cueEl = document.createElement("div");
        cueEl.className = "item-cue";
        cueEl.textContent = it.cue;
        body.appendChild(cueEl);
      }

      top.appendChild(check);
      top.appendChild(body);

      const howto = document.createElement("a");
      howto.className = "howto-btn";
      howto.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(it.t + " ejercicio técnica correcta");
      howto.target = "_blank";
      howto.rel = "noopener noreferrer";
      howto.title = "Ver cómo se hace";
      howto.textContent = "▶";
      howto.onclick = (e) => e.stopPropagation();
      top.appendChild(howto);

      if (it.hold) {
        const tBtn = document.createElement("button");
        tBtn.className = "timer-btn";
        const timerKey = activeDayIdx + "-" + itemId;
        tBtn.textContent = it.hold + "s";
        function startRealTimer() {
          let remaining = it.hold;
          tBtn.textContent = remaining + "s";
          if (remaining <= 5) beep(880, 0.12);
          const interval = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
              clearInterval(interval);
              tBtn.classList.remove("running");
              tBtn.textContent = "Listo ✓";
              beep(1200, 0.25);
              if (navigator.vibrate) { try { navigator.vibrate(200); } catch(e){} }
              setTimeout(() => { tBtn.textContent = it.hold + "s"; }, 1500);
              timers[timerKey] = { running: false };
            } else {
              tBtn.textContent = remaining + "s";
              if (remaining <= 5) beep(880, 0.12);
            }
          }, 1000);
          timers[timerKey] = { running: true, interval, phase: "hold" };
        }

        tBtn.onclick = (e) => {
          e.stopPropagation();
          if (timers[timerKey] && timers[timerKey].running) {
            clearInterval(timers[timerKey].interval);
            timers[timerKey].running = false;
            tBtn.textContent = it.hold + "s";
            tBtn.classList.remove("running");
            return;
          }
          tBtn.classList.add("running");
          // Cuenta regresiva previa de 3 segundos con sonido antes de iniciar el timer real
          let pre = 3;
          tBtn.textContent = pre;
          beep(660, 0.1);
          const preInterval = setInterval(() => {
            pre--;
            if (pre <= 0) {
              clearInterval(preInterval);
              if (navigator.vibrate) { try { navigator.vibrate(80); } catch(e){} }
              startRealTimer();
            } else {
              tBtn.textContent = pre;
              beep(660, 0.1);
            }
          }, 1000);
          timers[timerKey] = { running: true, interval: preInterval, phase: "pre" };
        };
        top.appendChild(tBtn);
      }

      row.appendChild(top);

      block.appendChild(row);
    });

    sectionsEl.appendChild(block);
  });

  const pct = totalItems ? Math.round((doneItems/totalItems)*100) : 0;
  progressFillEl.style.width = pct + "%";
  progressLabelEl.textContent = doneItems + " / " + totalItems + " ejercicios completados";
}

function renderFinishBtn() {
  const btn = document.getElementById("finishBtn");
  const key = dateKeyForDay(activeDayIdx);
  const done = !!finished[key];
  btn.textContent = done ? "✓ ¡Día completado!" : "✓ Día terminado";
  btn.classList.toggle("done", done);
}

  renderDay();

function buildSummaryText(idx) {
  const day = DAYS[idx];
  const key = dateKeyForDay(idx);
  const dp = progress[key] || {};
  const d = new Date();
  const fecha = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

  let doneNames = [];
  let totalItems = 0, doneItems = 0;
  day.sections.forEach((sec, si) => {
    sec.items.forEach((it, ii) => {
      totalItems++;
      if (dp[si + "-" + ii]) { doneItems++; doneNames.push(it.t); }
    });
  });

  let roundsLine = "";
  day.sections.forEach((sec, si) => {
    const maxR = /ronda/i.test(sec.name) ? maxRoundsFromName(sec.name) : null;
    if (maxR) {
      const r = rounds[key + "_" + si] || 0;
      roundsLine += `Rondas completadas: ${r} de ${maxR}\n`;
    }
  });

  const estMin = 30 + (doneItems >= totalItems ? 10 : 0); // rough estimate 30-40 min

  let text = `Entrenamiento de fuerza — ${fecha}\n`;
  text += `${day.title}\n`;
  text += `Duración aprox.: ${estMin} min\n`;
  text += roundsLine;
  text += `Ejercicios completados: ${doneItems}/${totalItems}\n`;
  if (doneNames.length) {
    text += "\n" + doneNames.map(n => "• " + n).join("\n");
  }
  text += "\n\n(Registrar como 'Entrenamiento de fuerza' en Google Fit)";
  return text;
}

document.getElementById("shareBtn").onclick = async () => {
  const text = buildSummaryText(activeDayIdx);
  const title = "Resumen de entrenamiento";
  if (navigator.share) {
    try {
      await navigator.share({ title, text });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // user cancelled, do nothing
      // fall through to clipboard fallback below
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast("Resumen copiado — pégalo en Google Fit");
  } catch (e) {
    showToast("No se pudo compartir ni copiar");
  }
};

document.getElementById("finishBtn").onclick = () => {
  const key = dateKeyForDay(activeDayIdx);
  finished[key] = !finished[key];
  saveFinished(finished);
  if (finished[key] && navigator.vibrate) { try { navigator.vibrate([60,40,60]); } catch(e){} }
  renderAll();
};

document.getElementById("resetBtn").onclick = () => {
  const key = dateKeyForDay(activeDayIdx);
  delete progress[key];
  delete finished[key];
  saveProgress(progress);
  saveFinished(finished);
  Object.keys(rounds).forEach(k => {
    if (k.indexOf(key + "_") === 0) delete rounds[k];
  });
  saveRounds(rounds);
  renderAll();
};

const themeBtn = document.getElementById("themeToggle");
let currentTheme = loadTheme();
if (currentTheme) document.documentElement.setAttribute("data-theme", currentTheme);
themeBtn.onclick = () => {
  currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", currentTheme);
  saveTheme(currentTheme);
};

renderAll();

// Mantener la pantalla encendida mientras la app está abierta (si el navegador lo soporta)
let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {
    // el permiso puede fallar si la pestaña no está visible o el dispositivo no lo soporta; no pasa nada
  }
}
requestWakeLock();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});
</script>
